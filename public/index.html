<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen Thread - X Thread to Speech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .tagline {
            color: #777;
            text-align: center;
            margin-bottom: 24px;
            font-size: 0.9em;
        }

        .steps {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.85em;
            color: #666;
        }

        .step-icon {
            font-size: 1.4em;
        }

        .hint {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-with-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .input-with-buttons input[type="text"] {
            flex: 1 1 200px;
            min-width: 0;
        }

        .url-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .url-action-btn {
            padding: 10px 14px;
            white-space: nowrap;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            color: #555;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            box-shadow: none;
        }

        .url-action-btn:hover {
            background: #e0e0e0;
            color: #333;
            border-color: #ccc;
            transform: none;
            box-shadow: none;
        }

        .url-action-btn:active {
            background: #d0d0d0;
            transform: none;
        }

        .url-action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            color: #888;
            border-color: #bbb;
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #90caf9;
        }

        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #81c784;
        }

        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }

        .audio-player {
            margin-top: 20px;
            display: none;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .info {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .example {
            margin-top: 15px;
            padding: 10px 12px;
            background: #f9f9f9;
            border-radius: 8px;
            font-size: 0.85em;
            color: #777;
        }

        .example-heading {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        .example code {
            font-size: 0.9em;
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .example strong {
            color: #555;
        }

        .lang-selector {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }
        .lang-selector button {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85em;
            background: #f0f0f0;
            color: #555;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .lang-selector button:hover {
            background: #e0e0e0;
            color: #333;
            transform: none;
            box-shadow: none;
        }
        .lang-selector button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-selector">
            <button type="button" id="langEs" class="lang-btn" data-lang="es">ES</button>
            <button type="button" id="langEn" class="lang-btn" data-lang="en">EN</button>
        </div>
        <h1>🎧 Listen Thread</h1>
        <p id="i18n-subtitle" class="subtitle">Convierte hilos de X a audio</p>
        <p id="i18n-tagline" class="tagline">Pega la URL de un hilo, elige la voz y escucha.</p>

        <!-- Pasos 1-2-3 dejados comentados tras revisión visual
        <div class="steps">
            <div class="step"><span class="step-icon">🔗</span><span id="i18n-step1">Pegar URL</span></div>
            <div class="step"><span class="step-icon">🎙️</span><span id="i18n-step2">Elegir voz</span></div>
            <div class="step"><span class="step-icon">🎧</span><span id="i18n-step3">Escuchar</span></div>
        </div>
        -->

        <div class="input-group">
            <label id="i18n-label-url" for="tweetUrl">Copia la URL del tweet/hilo en X y pégala aquí.</label>
            <div class="input-with-buttons">
                <input 
                    type="text" 
                    id="tweetUrl" 
                    placeholder="https://x.com/usuario/status/123456789..."
                />
                <div class="url-actions">
                    <button type="button" id="clearUrlBtn" class="url-action-btn" title="Limpiar URL">Limpiar</button>
                    <button type="button" id="pasteUrlBtn" class="url-action-btn" title="Pegar desde el portapapeles">Pegar</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label id="i18n-label-voice" for="voiceGender">Tipo de voz:</label>
            <select id="voiceGender">
                <option value="male" selected>Masculino</option>
                <option value="female">Femenino</option>
            </select>
        </div>

        <button id="convertBtn" onclick="convertThread()">
            Convertir a Audio
        </button>

        <div id="status" class="status"></div>

        <div id="audioPlayer" class="audio-player">
            <h3 id="i18n-audio-generated">🎵 Audio Generado</h3>
            <audio id="audioElement" controls></audio>
            <div id="info" class="info"></div>
        </div>

        <div class="example">
            <span id="i18n-example-note">Solo se aceptan URLs de hilos de X (x.com).</span>
        </div>
    </div>

    <script>
        const LANG_STORAGE_KEY = 'listen-thread-lang';

        const translations = {
            es: {
                title: 'Listen Thread - X Thread to Speech',
                subtitle: 'Convierte hilos de X a audio',
                tagline: 'Pega la URL de un hilo, elige la voz y escucha.',
                step1: 'Pegar URL',
                step2: 'Elegir voz',
                step3: 'Escuchar',
                hintUrl: 'Copia la URL de X y pégala aquí.',
                exampleHeading: 'Solo x.com',
                labelUrl: 'URL del hilo en X:',
                placeholderUrl: 'https://x.com/usuario/status/123456789...',
                btnClear: 'Limpiar',
                btnPaste: 'Pegar',
                titleClearUrl: 'Limpiar URL',
                titlePaste: 'Pegar desde el portapapeles',
                labelVoiceGender: 'Tipo de voz:',
                voiceMale: 'Masculino',
                voiceFemale: 'Femenino',
                btnConvert: 'Convertir a Audio',
                statusLoading: 'Procesando hilo... Esto puede tomar un momento.',
                statusSuccess: '¡Conversión exitosa!',
                statusErrorRequiredUrl: 'Por favor ingresa una URL válida',
                statusErrorInvalidUrl: 'Solo se aceptan URLs de hilos de X (x.com)',
                statusErrorPaste: 'Error al pegar: Permiso denegado o portapapeles vacío.',
                statusErrorProcess: 'Error al procesar el hilo',
                statusErrorNoTweets: 'No se encontraron tweets en el hilo',
                statusErrorRateLimit: 'Demasiadas peticiones. Intenta de nuevo en 15 minutos.',
                statusErrorServerHtml: 'El servidor respondió con una página de error; puede que la conversión haya tardado demasiado. Intenta de nuevo.',
                audioGenerated: 'Audio Generado',
                infoTweets: 'Tweets procesados:',
                infoChunks: 'Chunks de audio:',
                exampleNote: 'Solo se aceptan URLs de hilos de X (x.com).'
            },
            en: {
                title: 'Listen Thread - X Thread to Speech',
                subtitle: 'Convert X threads to audio',
                tagline: 'Paste a thread URL, choose a voice, and listen.',
                step1: 'Paste URL',
                step2: 'Choose voice',
                step3: 'Listen',
                hintUrl: 'Copy the URL from X and paste it here.',
                exampleHeading: 'Only x.com',
                labelUrl: 'Thread URL on X:',
                placeholderUrl: 'https://x.com/usuario/status/123456789...',
                btnClear: 'Clear',
                btnPaste: 'Paste',
                titleClearUrl: 'Clear URL',
                titlePaste: 'Paste from clipboard',
                labelVoiceGender: 'Voice type:',
                voiceMale: 'Male',
                voiceFemale: 'Female',
                btnConvert: 'Convert to Audio',
                statusLoading: 'Processing thread... This may take a moment.',
                statusSuccess: 'Conversion successful!',
                statusErrorRequiredUrl: 'Please enter a valid URL',
                statusErrorInvalidUrl: 'Only X thread URLs (x.com) are accepted',
                statusErrorPaste: 'Paste error: Permission denied or empty clipboard.',
                statusErrorProcess: 'Failed to process thread',
                statusErrorNoTweets: 'No tweets found in thread',
                statusErrorRateLimit: 'Too many requests. Please try again in 15 minutes.',
                statusErrorServerHtml: 'The server responded with an error page; the conversion may have taken too long. Please try again.',
                audioGenerated: 'Audio Generated',
                infoTweets: 'Tweets processed:',
                infoChunks: 'Audio chunks:',
                exampleNote: 'Only X thread URLs (x.com) are accepted.'
            }
        };

        const apiErrorMap = {
            'Tweet URL is required': 'statusErrorRequiredUrl',
            'Invalid X URL (only x.com is accepted)': 'statusErrorInvalidUrl',
            'No tweets found in thread': 'statusErrorNoTweets',
            'Failed to process thread': 'statusErrorProcess',
            'Too many requests from this IP, please try again after 15 minutes': 'statusErrorRateLimit'
        };

        function getInitialLang() {
            try {
                const saved = localStorage.getItem(LANG_STORAGE_KEY);
                if (saved === 'es' || saved === 'en') return saved;
            } catch (e) {}
            const browser = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (browser.startsWith('en')) return 'en';
            return 'es';
        }

        let currentLang = getInitialLang();

        function setLanguage(lang) {
            if (lang !== 'es' && lang !== 'en') return;
            currentLang = lang;
            try {
                localStorage.setItem(LANG_STORAGE_KEY, lang);
            } catch (e) {}
            applyTranslations();
            document.documentElement.lang = lang;
            document.title = translations[lang].title;
            document.querySelectorAll('.lang-selector button').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        function applyTranslations() {
            const t = translations[currentLang];
            if (!t) return;
            document.title = t.title;
            var el = document.getElementById('i18n-subtitle');
            if (el) el.textContent = t.subtitle;
            el = document.getElementById('i18n-tagline');
            if (el) el.textContent = t.tagline;
            el = document.getElementById('i18n-step1');
            if (el) el.textContent = t.step1;
            el = document.getElementById('i18n-step2');
            if (el) el.textContent = t.step2;
            el = document.getElementById('i18n-step3');
            if (el) el.textContent = t.step3;
            el = document.getElementById('i18n-label-url');
            if (el) el.textContent = t.hintUrl;
            document.getElementById('tweetUrl').placeholder = t.placeholderUrl;
            el = document.getElementById('clearUrlBtn');
            if (el) { el.textContent = t.btnClear; el.title = t.titleClearUrl; }
            el = document.getElementById('pasteUrlBtn');
            if (el) { el.textContent = t.btnPaste; el.title = t.titlePaste; }
            el = document.getElementById('i18n-label-voice');
            if (el) el.textContent = t.labelVoiceGender;
            var sel = document.getElementById('voiceGender');
            if (sel) {
                sel.options[0].text = t.voiceMale;
                sel.options[1].text = t.voiceFemale;
            }
            el = document.getElementById('convertBtn');
            if (el) el.textContent = t.btnConvert;
            el = document.getElementById('i18n-audio-generated');
            if (el) el.textContent = '🎵 ' + t.audioGenerated;
            el = document.getElementById('i18n-example-heading');
            if (el) el.textContent = t.exampleHeading;
            el = document.getElementById('i18n-example-note');
            if (el) el.textContent = t.exampleNote;
        }

        function t(key) {
            return (translations[currentLang] && translations[currentLang][key]) || key;
        }

        function translateApiError(message) {
            if (!message || typeof message !== 'string') return message;
            var key = apiErrorMap[message.trim()];
            return key ? t(key) : message;
        }

        async function convertThread() {
            const urlInput = document.getElementById('tweetUrl');
            const statusDiv = document.getElementById('status');
            const audioPlayer = document.getElementById('audioPlayer');
            const audioElement = document.getElementById('audioElement');
            const infoDiv = document.getElementById('info');
            const convertBtn = document.getElementById('convertBtn');

            const url = urlInput.value.trim();

            if (!url) {
                showStatus('error', t('statusErrorRequiredUrl'));
                return;
            }

            // Validar que la URL sea de X (x.com)
            const xUrlPattern = /^https?:\/\/(www\.)?x\.com\//i;
            if (!xUrlPattern.test(url)) {
                showStatus('error', t('statusErrorInvalidUrl'));
                return;
            }

            // Reset
            audioPlayer.style.display = 'none';
            convertBtn.disabled = true;

            // Show loading
            showStatus('loading', '<div class="loader"></div> ' + t('statusLoading'));

            const gender = document.getElementById('voiceGender').value || 'male';

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url, gender })
                });

                const text = await response.text();
                const contentType = (response.headers.get('Content-Type') || '').toLowerCase();
                if (text.trim().startsWith('<') || !contentType.includes('application/json')) {
                    showStatus('error', '✗ ' + t('statusErrorServerHtml'));
                    return;
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseErr) {
                    showStatus('error', '✗ ' + t('statusErrorServerHtml'));
                    return;
                }

                if (!response.ok) {
                    var rawMsg = (data && data.error) || (data && data.message);
                    var errMsg = rawMsg ? translateApiError(rawMsg) : t('statusErrorProcess');
                    throw new Error(errMsg);
                }

                // Show success
                showStatus('success', '✓ ' + t('statusSuccess'));
                
                // Show audio player
                audioElement.src = data.audioUrl;
                audioPlayer.style.display = 'block';
                
                // Show info
                infoDiv.innerHTML = '<strong>' + t('infoTweets') + '</strong> ' + data.tweets + '<br><strong>' + t('infoChunks') + '</strong> ' + data.chunks;

            } catch (error) {
                var msg = (error && error.message) ? translateApiError(error.message) : t('statusErrorProcess');
                showStatus('error', '✗ ' + msg);
            } finally {
                convertBtn.disabled = false;
            }
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;
            statusDiv.innerHTML = message;
        }

        // Allow Enter key to submit
        document.getElementById('tweetUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertThread();
            }
        });

        document.getElementById('clearUrlBtn').addEventListener('click', clearUrlInput);
        document.getElementById('pasteUrlBtn').addEventListener('click', pasteFromClipboard);

        function clearUrlInput() {
            document.getElementById('tweetUrl').value = '';
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('tweetUrl').value = text;
            } catch (err) {
                console.error('Failed to read clipboard contents: ', err);
                showStatus('error', t('statusErrorPaste'));
            }
        }

        document.getElementById('langEs').addEventListener('click', function() { setLanguage('es'); });
        document.getElementById('langEn').addEventListener('click', function() { setLanguage('en'); });

        applyTranslations();
        document.documentElement.lang = currentLang;
        document.querySelectorAll('.lang-selector button').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
        });
    </script>
</body>
</html>
