# Deploy to VM (e.g. Google Cloud) on every push to main.
# Requires GitHub Secrets: SSH_PRIVATE_KEY, SSH_USERNAME, SSH_HOST, DOTENV_CONTENT.
# See DEPLOYMENT.md for VM setup and "solo tú" checklist.

name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (verify lockfile)
        run: npm ci

      - name: Prepare .env for VM
        run: |
          printf '%s' "${{ secrets.DOTENV_CONTENT }}" > .env.remote

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          raw="${{ secrets.SSH_PRIVATE_KEY }}"
          # Optional: secret can be "base64:<b64>" to avoid paste/encoding issues
          if [[ "$raw" == base64:* ]]; then
            echo "${raw#base64:}" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s' "$raw" | tr -d '\r' > ~/.ssh/deploy_key
            [ -n "$(tail -c1 ~/.ssh/deploy_key 2>/dev/null)" ] && echo >> ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY invalid or corrupted. Fix: 1) Regenerate: ssh-keygen -t ed25519 -C deploy -f deploy_key -N \"\" 2) Add public key to VM authorized_keys 3) Store private key in secret. Or use base64: run 'base64 -w0 deploy_key' and set secret to 'base64:' + that output."
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure rsync on VM
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'command -v rsync >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y rsync)'

      - name: Rsync to VM
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'audio' \
            --exclude '.env.remote' \
            . "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/listen-thread/"
          # Write .env on VM from secret (scp .env.remote as .env)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            .env.remote "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/listen-thread/.env"

      - name: Deploy on VM (install, playwright, pm2)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" 'set -e
            cd /var/www/listen-thread
            npm ci --omit=dev
            npx playwright install chromium --with-deps
            pm2 delete listen-thread || true
            pm2 start index.js --name listen-thread
            pm2 save'
