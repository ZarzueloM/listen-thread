# Referencia: directivas para /etc/nginx/nginx.conf (optimización VM 1 GB RAM).
# No es un archivo completo; incorporar en la VM en el nginx.conf principal.
# Tras editar: sudo nginx -t && sudo systemctl reload nginx

# En la sección principal (fuera de http {}):
worker_processes 1;

# Dentro del bloque events { } (ya existente en nginx.conf):
events {
    worker_connections 512;
}
