# Proxy inverso para Listen Thread.
# Copiar a /etc/nginx/sites-available/listen-thread y sustituir DOMINIO por tu dominio.
# Certbot usa /etc/letsencrypt/live/DOMINIO/ para los certificados.

upstream listen_thread_backend {
    server 127.0.0.1:3000;
    keepalive 8;
}

# HTTP (redirect a HTTPS si usas Cloudflare/SSL)
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Conversión puede tardar 1–3+ min (scraping + TTS + merge). Evita "upstream timed out".
    location = /api/convert {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }
}

# HTTPS (necesario para Cloudflare Full/Full Strict; certificados de Certbot)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMINIO;

    ssl_certificate /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/convert {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }
}
