# Proxy inverso para Listen Thread (solo HTTP; certbot --nginx añadirá HTTPS).
# Copiar a /etc/nginx/sites-available/listen-thread y sustituir DOMINIO por tu dominio.

upstream listen_thread_backend {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name listenthread.org;

    # Conversión puede tardar 1–3+ min (scraping + TTS + merge). Evita "upstream timed out".
    location = /api/convert {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://listen_thread_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffers reducidos para VM con poca RAM (1 GB)
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 0;
    }
}
